<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="t">
  <title id="t">Three adult learners talking together around a table</title>
  <style>
    .float { animation: float 5s ease-in-out infinite alternate; }
    .float-2 { animation-duration: 6s; animation-delay: -2s; }
    .float-3 { animation-duration: 4.4s; animation-delay: -1s; }
    .tw { transform-box: fill-box; transform-origin: center; animation: tw 3.4s ease-in-out infinite; }
    .tw-2 { animation-delay: -1.6s; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-7px); } }
    @keyframes tw { 0%,100% { transform: scale(.8) rotate(0); } 50% { transform: scale(1.12) rotate(20deg); } }
    @media (prefers-reduced-motion: reduce) { .float, .tw { animation: none; } }
  </style>
  <defs>
    <clipPath id="frame"><rect width="600" height="520" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect width="600" height="520" fill="#EAF3FC"/>
    <path d="M470-30c80-10 160 40 150 110s-90 90-150 70-80-60-70-110 20-66 70-70Z" fill="#FFE3D9"/>
    <path d="M-40 250c30-50 110-60 130-10s-10 110-60 120-100-60-70-110Z" fill="#DDF5EF"/>
    <circle cx="300" cy="40" r="46" fill="#F1ECFF"/>

    <!-- Confetti -->
    <circle cx="560" cy="250" r="6" fill="#F472B6"/>
    <circle cx="36" cy="160" r="5" fill="#F4B942"/>
    <rect x="270" y="110" width="10" height="10" rx="2" fill="#14B8A6" transform="rotate(20 275 115)"/>
    <path d="M520 300l8 14h-16Z" fill="#8B5CF6"/>
    <path class="tw" d="M300 60c1 10 5 14 15 15-10 1-14 5-15 15-1-10-5-14-15-15 10-1 14-5 15-15Z" fill="#F4B942"/>
    <path class="tw tw-2" d="M40 40c.8 7 3 9.4 10 10-7 .8-9.2 3-10 10-.8-7-3-9.2-10-10 7-.6 9.2-3 10-10Z" fill="#FF7A59"/>

    <!-- Speech bubble: question -->
    <g class="float">
      <path d="M46 70h200a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H128l-22 22 4-22H46a16 16 0 0 1-16-16V86a16 16 0 0 1 16-16Z" fill="#FFFFFF" stroke="#C6D9EE" stroke-width="1.5"/>
      <text x="50" y="105" font-size="17" font-weight="600" fill="#0B2547">How was your weekend?</text>
    </g>

    <!-- Speech bubble: answer -->
    <g class="float float-2">
      <path d="M346 128h218a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16h-84l2 24-24-24H346a16 16 0 0 1-16-16v-26a16 16 0 0 1 16-16Z" fill="#0756A5"/>
      <text x="350" y="163" font-size="16.5" font-weight="600" fill="#FFFFFF">I went hiking with friends!</text>
    </g>

    <!-- Vocabulary card -->
    <g class="float float-3">
      <rect x="176" y="146" width="138" height="52" rx="10" fill="#FFFFFF" stroke="#C6D9EE" stroke-width="1.5"/>
      <rect x="176" y="146" width="6" height="52" rx="3" fill="#F4B942"/>
      <text x="194" y="168" font-size="15" font-weight="700" fill="#0B2547">hiking</text>
      <text x="194" y="188" font-size="13" fill="#5B6B80">/ˈhaɪkɪŋ/ · noun</text>
    </g>

    <!-- Person 1 (left): curly hair, yellow jumper -->
    <g>
      <path d="M70 410c0-62 26-100 70-100s70 38 70 100Z" fill="#F4B942"/>
      <path d="M118 318q22 14 44 0" stroke="#D99A1E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="128" y="282" width="24" height="34" rx="10" fill="#7A4A2E"/>
      <circle cx="140" cy="244" r="47" fill="#1E1A1A"/>
      <circle cx="104" cy="228" r="16" fill="#1E1A1A"/>
      <circle cx="176" cy="228" r="16" fill="#1E1A1A"/>
      <circle cx="140" cy="200" r="20" fill="#1E1A1A"/>
      <circle cx="140" cy="258" r="36" fill="#8D5A3B"/>
      <circle cx="104" cy="262" r="7" fill="#8D5A3B"/>
      <circle cx="176" cy="262" r="7" fill="#8D5A3B"/>
      <circle cx="127" cy="256" r="3.6" fill="#172033"/>
      <circle cx="153" cy="256" r="3.6" fill="#172033"/>
      <path d="M127 272q13 11 26 0" stroke="#172033" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Person 2 (centre): bob haircut, blue shirt, listening -->
    <g>
      <path d="M232 410c0-62 26-98 68-98s68 36 68 98Z" fill="#0756A5"/>
      <path d="M284 314l16 22 16-22" fill="#FFFFFF"/>
      <rect x="288" y="284" width="24" height="34" rx="10" fill="#E8B48A"/>
      <path d="M252 258c0-36 20-56 48-56s48 20 48 56v38h-96Z" fill="#6B3F25"/>
      <circle cx="300" cy="260" r="35" fill="#F2C9A0"/>
      <path d="M264 250q4-40 38-40 34 0 34 36-20-4-36-24-10 22-36 28Z" fill="#6B3F25"/>
      <circle cx="287" cy="262" r="3.6" fill="#172033"/>
      <circle cx="313" cy="262" r="3.6" fill="#172033"/>
      <path d="M290 277q10 7 20 0" stroke="#172033" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Person 3 (right): hijab, light top, answering -->
    <g>
      <path d="M392 410c0-62 26-98 68-98s68 36 68 98Z" fill="#FFFFFF" stroke="#C6D9EE" stroke-width="1.5"/>
      <path d="M412 250c0-34 20-58 48-58s48 24 48 58c0 30-6 52-20 66h-56c-14-14-20-36-20-66Z" fill="#0B2547"/>
      <ellipse cx="460" cy="260" rx="30" ry="35" fill="#C68E5F"/>
      <path d="M430 246q2-26 30-28 28 2 30 28-14-12-30-12t-30 12Z" fill="#0B2547"/>
      <circle cx="448" cy="260" r="3.6" fill="#172033"/>
      <circle cx="472" cy="260" r="3.6" fill="#172033"/>
      <path d="M448 274q12 12 24 0Z" fill="#172033"/>
    </g>

    <!-- Table -->
    <rect x="0" y="404" width="600" height="116" fill="#0756A5"/>
    <rect x="0" y="404" width="600" height="8" fill="#063F7A"/>
    <rect x="-10" y="392" width="620" height="16" rx="8" fill="#FFFFFF" stroke="#C6D9EE" stroke-width="1.5"/>

    <!-- On the table: open book, notebook, laptop, mug -->
    <path d="M86 392l52-14 52 14Z" fill="#FFFFFF" stroke="#B8C3D3" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M138 378v14" stroke="#B8C3D3" stroke-width="1.5"/>
    <rect x="258" y="380" width="78" height="12" rx="3" fill="#F4B942"/>
    <path d="M312 372l26-16" stroke="#0B2547" stroke-width="4" stroke-linecap="round"/>
    <rect x="402" y="336" width="112" height="56" rx="6" fill="#D8DEE8" stroke="#B8C3D3" stroke-width="1.5"/>
    <circle cx="458" cy="364" r="8" fill="#FFFFFF"/>
    <rect x="532" y="362" width="28" height="30" rx="5" fill="#FFFFFF" stroke="#B8C3D3" stroke-width="1.5"/>
    <path d="M560 370q12 0 12 9t-12 9" stroke="#B8C3D3" stroke-width="3" fill="none"/>

    <!-- Brand line on table front -->
    <text x="300" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#BFD6EE" letter-spacing="2">LEARN ENGLISH · FIND YOUR VOICE</text>
  </g>
</svg>
